# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
#
# Kotlin compilation runs in its own daemon (kotlin.daemon.jvmargs below), but
# R8 minification, APK packaging and the Android unit-test launcher all run in
# THIS one -- and R8 is the single hungriest step in the build. 3g starved it.
# G1 rather than ParallelGC: the JS/Wasm klib IR link holds a large live set,
# and G1 both handles that better and returns memory to the OS between tasks.
#
# 6g -> 8g. IDE import, not compilation, is what sets this floor. At 6g the import
# died three times with the same signature: old generation pinned above 99.9%, half
# of daemon uptime spent in full GC, then OutOfMemoryError -- a collector thrashing
# against a live set it cannot fit, not a leak. Invalidating IDE caches changed
# nothing, which is the tell that the import model itself is the size problem.
#
# 8g is the last raise this machine affords: 8g daemon + Studio ~2.5g + desktop ~2g
# is ~12.5g of 15g, leaving little page cache. Do not go higher here -- past this
# the daemon starts winning memory away from Studio and the sync gets slower, not
# more reliable. If an import still OOMs at 8g, reduce the WORK instead (see
# enableSlowSourcesJarResolver below, or cut the target/module count at import).
org.gradle.jvmargs=-Xmx8g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=768m

# The Kotlin compile daemon is a SEPARATE JVM. With this unset it inherits
# org.gradle.jvmargs, which meant Gradle and Kotlin each reserved the same
# heap -- 16g of -Xmx on a 16g machine. Sized explicitly instead.
#
# 5g -> 2g. The three JVMs here (Gradle 6g + Kotlin 5g + Native 6g) declared a
# 17g ceiling, which does not fit a 16g machine before the IDE's 2-4g and the
# desktop's ~2g. Nothing enforces the total, so they grow until the kernel pages
# -- which is both the OOM kills AND the "import takes forever", because a GC
# paging its own heap is orders of magnitude slower than one that is not.
#
# This is the right JVM to shrink: IDE import is dependency resolution, which
# runs in the Gradle daemon above, so the Kotlin daemon is near-idle during the
# operation that was failing. Raise it back toward 4g if a COMPILE starts
# failing on heap -- but not an import, which this will not help.
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseG1GC -XX:MaxMetaspaceSize=768m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true

# Every compile*ExecutableKotlinJs / *KotlinWasmJs task deserializes full klib
# IR bodies into the SHARED Kotlin daemon heap. Unbounded, Gradle scheduled ~14
# of them concurrently on this 16-core box and the daemon OOMed. Cap the fan-out
# so the concurrent live set fits the heap above.
#
# 4 -> 3, because that heap came down with it. Cores are not the constraint on
# this machine; memory is, and oversubscribing cores is what turns a memory
# shortage into paging.
org.gradle.workers.max=3

# Not encouraged by Gradle and can produce weird results. Wait for isolated projects instead.
org.gradle.configureondemand=false

# The native file watcher holds a snapshot of the whole tree, and threw its own
# OutOfMemoryError during an IDE import on a 16g machine. It is a symptom rather
# than a cause, but it is not worth paying for while memory is the binding
# constraint. Re-enable on a machine with headroom -- it does make incremental
# builds faster.
org.gradle.vfs.watch=false

# Hand the daemon's heap back to the OS sooner. The default is three hours,
# which leaves a 6g process resident while the IDE wants the same memory.
org.gradle.daemon.idletimeout=1800000

# Enable caching between builds.
org.gradle.caching=true

# Enable configuration caching between builds.
org.gradle.configuration-cache=true
# This option is set because of https://github.com/google/play-services-plugins/issues/246
# to generate the Configuration Cache regardless of incompatible tasks.
# See https://github.com/android/nowinandroid/issues/1022 before using it.
org.gradle.configuration-cache.problems=warn

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Disable build features that are enabled by default,
# https://developer.android.com/build/releases/gradle-plugin#default-changes
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.testOptions.unitTests.isIncludeAndroidResources = true
org.jetbrains.compose.experimental.jscanvas.enabled=true

RblClientIdProp=a
RblClientSecretProp=b

# IDE import resolves a `-sources.jar` for every dependency of every source set, and this project
# has six targets across ~40 modules -- so the Apple source sets alone multiply that work on a host
# that can never compile them. It is the resolver named in the import OOMs
# (IdeMultiplatformImportImpl$RegisteredDependencyResolver), and turning it off is the one lever
# that reduces the WORK rather than raising the ceiling for it.
#
# The cost is that external dependencies import without attached sources, so stepping into a library
# shows decompiled bytecode instead. Kotlin and Android sources still attach through their own
# mechanisms. Flip back to true on a machine with the memory to spare.
kotlin.mpp.import.enableSlowSourcesJarResolver=false

kotlin.native.ignoreDisabledTargets=true

# Memory for the Kotlin/Native COMPILER (a separate JVM from the Gradle daemon).
#
# 6g -> 1g. The only native targets are iosArm64 and iosSimulatorArm64, so this
# compiler runs on an Apple host and nowhere else -- on Linux and Windows the
# reservation is pure ceiling, counted against the machine and never used.
#
# Note this does NOT reduce the cost of Apple targets at IDE import time.
# `ignoreDisabledTargets` above skips their COMPILATION, not their import: the
# IDE resolver still walks iosMain/appleTest for every module, in the Gradle
# daemon, on every host. That is a separate problem from this setting.
#
# Raise it on macOS if a native link runs short.
kotlin.native.jvmArgs=-Xmx1g -XX:+UseG1GC
# Disable memory-intensive compiler optimizations
kotlin.native.disableCompilerDaemon=true
kotlin.kmp.unresolvedDependenciesDiagnostic=false
kotlin.apple.xcodeCompatibility.nowarn=true

# Config
minSdk=21
targetSdk=36
compileSdk=36

# v2.0 matrix mode opt-in — builds every variant in one Gradle invocation.
# Comment-out (or set to false) to keep v1.x active-variant-only semantics.
#
# Disabled (2026-05-19) to unblock the kover coverage gate.
# Matrix mode registers inactive-variant compilations whose defaultSourceSet
# chain does NOT include the target's standard `<target>Main` source set, so
# `expect val ... : Module` declarations in commonMain fail to resolve their
# actuals (which live in desktopMain / iosMain / etc) when KMP compiles the
# inactive variant. Reproducible on `:core:database`, `:core:data`, and any
# of the ~30 expect declarations across `core/*`, `core-base/*`, `feature/*`.
#
# Flip back to `true` once kmp-product-flavors upstream-fixes the source-set
# wiring (variant.defaultSourceSet.dependsOn(targetMain) for inactive-variant
# compilations). Tracking: kmp-project-template Gap #1 in
# docs/reports/source-coverage-260519.md → resolution pending the upstream PR.
kmpFlavors.buildMatrix=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
