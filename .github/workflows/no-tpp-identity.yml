#
# The HSBC TPP identity (signing key, transport certificate, client id, kid, software statement,
# signing issuer) lives ONLY in the Cloudflare Worker (bff/). This gate keeps it that way: it fails
# when app source references any of it, and when a built Android or desktop artefact carries a
# .pem / .p12 / certs/ entry. No secret is needed to run it.
name: no-tpp-identity

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Grep app source for TPP identity symbols
        run: |
          # `if grep` rather than `! grep`: bash's errexit ignores a negated command, so `! grep`
          # would let a match through.
          if grep -rnE "HSBC_(KID|CLIENT_ID|SOFTWARE_STATEMENT|TRANSPORT_P12_PASSWORD|SIGNING_ISSUER)|installMtls|MtlsIdentity|signing_key|transport\.p12" \
               --include='*.kt' --include='*.kts' --include='*.swift' \
               core cmp-android cmp-desktop cmp-ios cmp-shared cmp-web feature; then
            echo "::error::TPP identity referenced in app source — it belongs in the Worker (bff/)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android + desktop artefacts
        run: ./gradlew :cmp-android:assembleDemoDebug :cmp-desktop:packageUberJarForCurrentOS :cmp-desktop:createDistributable

      - name: Refuse .pem / .p12 / certs/ inside artefacts
        run: |
          fail=0
          found=0
          while IFS= read -r -d '' a; do
            found=1
            if unzip -l "$a" | grep -E '\.pem$|\.p12$|(^|/)certs/'; then
              echo "::error file=$a::TPP identity material inside a built artefact"
              fail=1
            fi
          done < <(find cmp-android/build/outputs/apk cmp-desktop/build/compose -type f \( -name '*.apk' -o -name '*.jar' \) -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::no APK or jar was produced — nothing was scanned"
            exit 1
          fi
          exit $fail
